spring.application.name=settlement-service
server.servlet.context-path=/app/v1

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# Database
# Statement caching was measured on expense-service at 47 prepares for ~90k
# executions. useLocalSessionState avoids the driver round-tripping to read
# server session state.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:settlement_db}?useLocalSessionState=true&cachePrepStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection pool. The Hikari default of 10 saturated expense-service under
# load — 188 threads queued, acquire waits up to 1.9s. MySQL allows 151
# connections and peak use across all services was 42, so there is headroom.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

# Hikari opens connections with autocommit on, so every transaction begins with
# a SET autocommit=0 round trip and ends with another to restore it. Telling
# Hibernate the provider already disabled autocommit removes both, and lets it
# defer acquiring a connection until the first statement actually runs.
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Defaults to true in Spring Boot, which holds the persistence context and its
# connection open for the whole request including JSON serialization.
spring.jpa.open-in-view=false
# Safe to disable open-in-view: SettlementEntity has no associations at all.

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=settlement-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.be9expensphie.common.event
spring.kafka.consumer.auto-offset-reset=earliest

# --- Actuator / Prometheus metrics ---
# The management server listens on its own port, which docker-compose never
# publishes, so /actuator is reachable only from inside the compose network.
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
# Server-side histogram buckets, so Grafana can compute true p95/p99 rather
# than averaging pre-computed percentiles across instances.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
